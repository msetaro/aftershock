name: CMake migration
on:
  pull_request:
    branches: [modernization]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '1789257600'
  CMAKE_BUILD_PARALLEL_LEVEL: '8'
jobs:
  unix:
    name: CMake ${{ matrix.tool }} ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
        tool: [gcc, clang, linux-arm64, macos-x64, macos-arm64]
        include:
          - tool: gcc
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
          - tool: clang
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
          - tool: linux-arm64
            runner: ubuntu-22.04-arm
            cc: gcc
            cxx: g++
          - tool: macos-x64
            runner: macos-14
            cc: clang
            cxx: clang++
            make_arch: x86_64
            cmake_arch: x86_64
          - tool: macos-arm64
            runner: macos-14
            cc: clang
            cxx: clang++
            make_arch: aarch64
            cmake_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y ninja-build libsdl2-dev libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libc++-dev libc++abi-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-${{ matrix.tool }}-${{ matrix.config }}
      - name: Raw object parity with Make
        shell: bash
        run: |
          extra=()
          cxx='${{ matrix.cxx }}'
          if [ '${{ matrix.tool }}' = clang ]; then
            cxx+=' -stdlib=libc++'
            extra+=(--cmake-setting CMAKE_CXX_FLAGS=-stdlib=libc++)
          fi
          if [ '${{ runner.os }}' = macOS ]; then
            extra+=(--make-setting ARCH=${{ matrix.make_arch }} --cmake-setting CMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }})
          fi
          for renderer in opengl vulkan; do
            python3 -B tools/port/check_cmake_parity.py --output "$RUNNER_TEMP/parity-$renderer" --config '${{ matrix.config }}' \
              --make-setting 'CC=ccache ${{ matrix.cc }}' --make-setting "CXX=ccache $cxx" \
              --make-setting USE_RENDERER_DLOPEN=0 --make-setting "RENDERER_DEFAULT=$renderer" \
              --cmake-setting CMAKE_C_COMPILER=${{ matrix.cc }} --cmake-setting CMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              --cmake-setting "RENDERER_DEFAULT=$renderer" "${extra[@]}"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cmake-parity-${{ matrix.tool }}-${{ matrix.config }}
          path: |
            ${{ runner.temp }}/parity-*/build.log
            ${{ runner.temp }}/parity-*/differences.json
            ${{ runner.temp }}/parity-*/*/compile_commands.json
            ${{ runner.temp }}/parity-*/*/object-hashes.json
          if-no-files-found: error
  msvc:
    name: CMake MSVC ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_${{ matrix.arch }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-msvc-${{ matrix.arch }}-${{ matrix.config }}
      - name: Build through ccache
        shell: pwsh
        run: |
          foreach ($renderer in @('opengl', 'vulkan')) {
            cmake -S . -B "build/cmake-$renderer" -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.config }} "-DRENDERER_DEFAULT=$renderer"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build "build/cmake-$renderer"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Generate and build Visual Studio projects
        run: |
          cmake --preset msvc-${{ matrix.arch }}
          cmake --build --preset msvc-${{ matrix.arch }} --config ${{ matrix.config }}
  cross:
    name: CMake MinGW ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7
      - name: Cross dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y ninja-build g++-mingw-w64-x86-64
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-mingw-${{ matrix.config }}
      - name: Raw object parity with Make
        run: |
          for renderer in opengl vulkan; do
            python3 -B tools/port/check_cmake_parity.py --output "$RUNNER_TEMP/parity-$renderer" --config '${{ matrix.config }}' \
              --make-setting PLATFORM=mingw64 --make-setting ARCH=x86_64 --make-setting USE_SDL=0 --make-setting USE_CURL=0 \
              --make-setting 'CC=ccache x86_64-w64-mingw32-gcc' --make-setting 'CXX=ccache x86_64-w64-mingw32-g++' \
              --make-setting USE_RENDERER_DLOPEN=0 --make-setting "RENDERER_DEFAULT=$renderer" \
              --cmake-setting CMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw64.cmake --cmake-setting USE_SDL=OFF --cmake-setting USE_CURL=OFF \
              --cmake-setting "RENDERER_DEFAULT=$renderer"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cmake-parity-mingw-${{ matrix.config }}
          path: |
            ${{ runner.temp }}/parity-*/build.log
            ${{ runner.temp }}/parity-*/differences.json
            ${{ runner.temp }}/parity-*/*/compile_commands.json
            ${{ runner.temp }}/parity-*/*/object-hashes.json
          if-no-files-found: error
