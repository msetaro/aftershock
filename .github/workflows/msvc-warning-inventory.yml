name: msvc-warning-inventory
on:
  push:
    branches: [issue/8-msvc-inventory]
  workflow_dispatch:
env:
  SOURCE_DATE_EPOCH: "1789257600"
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
jobs:
  inventory:
    if: false # MSVC inventory completed in 35455896498
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        config: [Release, Debug]
        include:
          - arch: x64
            vcvars: amd64
          - arch: arm64
            vcvars: amd64_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-msvc-${{ matrix.arch }}-${{ matrix.config }}
      - name: Inventory unsuppressed W4 diagnostics
        shell: pwsh
        run: |
          $failed = $false
          foreach ($renderer in @('opengl', 'vulkan')) {
            cmake -S . -B "build/inventory-$renderer" -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.config }} "-DRENDERER_DEFAULT=$renderer"
            if ($LASTEXITCODE) { $failed = $true; continue }
            cmake --build "build/inventory-$renderer"
            if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { exit 1 }
  apple:
    if: false # Apple inventory completed in 35457048020
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-apple-inventory-${{ matrix.arch }}-${{ matrix.config }}
      - name: Inventory Apple deprecations
        shell: bash
        run: |
          failed=0
          for renderer in opengl vulkan; do
            cmake -S . -B "build/apple-$renderer" -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DRENDERER_DEFAULT="$renderer" || { failed=1; continue; }
            cmake --build "build/apple-$renderer" || failed=1
          done
          exit "$failed"
