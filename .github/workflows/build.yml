name: build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/*'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/*'
  release:
    types: [published]

  workflow_dispatch:

env:
  SOURCE_DATE_EPOCH: "1789257600"
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
jobs:
  unix:
    name: ${{ matrix.config }} ${{ matrix.tool }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - Release
        - Debug
        tool:
        - gcc
        - clang
        - linux-arm64
        - macos-x64
        - macos-arm64
        include:
        - tool: gcc
          runner: ubuntu-24.04
          cc: gcc
          cxx: g++
          artifact: linux-x86_64
        - tool: clang
          runner: ubuntu-24.04
          cc: clang
          cxx: clang++
          artifact: linux-clang-x86_64
        - tool: linux-arm64
          runner: ubuntu-22.04-arm
          cc: gcc
          cxx: g++
          artifact: linux-arm64
        - tool: macos-x64
          runner: macos-14
          cc: clang
          cxx: clang++
          make_arch: x86_64
          cmake_arch: x86_64
          artifact: macos-x86_64
        - tool: macos-arm64
          runner: macos-14
          cc: clang
          cxx: clang++
          make_arch: aarch64
          cmake_arch: arm64
          artifact: macos-aarch64
    steps:
    - uses: actions/checkout@v7
    - name: Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y ninja-build libsdl2-dev libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libc++-dev libc++abi-dev
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: cmake-${{ matrix.tool }}-${{ matrix.config }}
    - name: Build and stage binaries
      shell: bash
      run: |
        extra=()
        if [ '${{ matrix.tool }}' = clang ]; then
          extra+=('-DCMAKE_CXX_FLAGS=-stdlib=libc++')
        fi
        if [ '${{ runner.os }}' = macOS ]; then
          extra+=('-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}')
        fi
        cmake -S . -B build/vulkan -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} "${extra[@]}"
        cmake --build build/vulkan
        cmake --install build/vulkan --config '${{ matrix.config }}' --prefix "$GITHUB_WORKSPACE/bin"
    - uses: actions/upload-artifact@v7
      if: matrix.config == 'Release'
      with:
        name: ${{ matrix.artifact }}
        path: bin
        if-no-files-found: error
        retention-days: 5
  windows-msvc:
    name: ${{ matrix.config }} Windows-MSVC ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x64
        - arm64
        config:
        - Release
        - Debug
        include:
        - arch: x64
          vcvars: amd64
          artifact: windows-msvc-x86_64
        - arch: arm64
          vcvars: amd64_arm64
          artifact: windows-msvc-arm64
    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.vcvars }}
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: cmake-msvc-${{ matrix.arch }}-${{ matrix.config }}
    - name: Build through ccache
      shell: pwsh
      run: |
        cmake -S . -B build/cmake-vulkan -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        cmake --build build/cmake-vulkan
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        cmake --install build/cmake-vulkan --config ${{ matrix.config }} --prefix "$env:GITHUB_WORKSPACE/bin"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Generate and build Visual Studio projects
      run: |
        cmake --preset msvc-${{ matrix.arch }}
        cmake --build --preset msvc-${{ matrix.arch }} --config ${{ matrix.config }}
    - uses: actions/upload-artifact@v7
      if: matrix.config == 'Release'
      with:
        name: ${{ matrix.artifact }}
        path: bin
        if-no-files-found: error
        retention-days: 5
  windows-msys:
    name: ${{ matrix.config }} Windows-MinGW x86_64
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
        - Release
        - Debug
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7
    - uses: msys2/setup-msys2@v2
      with:
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-ccache mingw-w64-x86_64-zlib
        msystem: MINGW64
        path-type: minimal
        release: false
        update: false
        cache: false
    - uses: actions/cache@v5
      with:
        path: .ccache
        key: ccache-msys-${{ matrix.config }}-${{ github.sha }}
        restore-keys: ccache-msys-${{ matrix.config }}-
    - name: Build and stage binaries
      run: |
        export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
        cmake -S . -B build/vulkan -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DUSE_SDL=OFF
        cmake --build build/vulkan
        cmake --install build/vulkan --config '${{ matrix.config }}' --prefix "$GITHUB_WORKSPACE/bin"
        ccache -s
    - uses: actions/upload-artifact@v7
      if: matrix.config == 'Release'
      with:
        name: windows-gcc-x86_64
        path: bin
        if-no-files-found: error
        retention-days: 5
  create-testing:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
    - unix
    - windows-msvc
    - windows-msys
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
    - name: Create binary archives
      run: |
        7z a -r quake3e-linux-x86_64.zip         ./linux-x86_64/*
        7z a -r quake3e-linux-arm64.zip          ./linux-arm64/*
        7z a -r quake3e-windows-mingw-x86_64.zip ./windows-gcc-x86_64/*
        7z a -r quake3e-windows-msvc-arm64.zip   ./windows-msvc-arm64/*
        7z a -r quake3e-macos-x86_64.zip         ./macos-x86_64/*
        7z a -r quake3e-macos-aarch64.zip        ./macos-aarch64/*
    - name: Create latest build
      uses: czietz/action-automatic-releases@latest
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: latest
        prerelease: false
        title: Latest Build
        files: |
          *.zip
  update-release:
    if: ${{ github.event_name == 'release' }}
    needs:
    - unix
    - windows-msvc
    - windows-msys
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - artifact_dir: linux-x86_64
          artifact_name: quake3e-linux-x86_64.zip
        - artifact_dir: linux-arm64
          artifact_name: quake3e-linux-arm64.zip
        - artifact_dir: windows-gcc-x86_64
          artifact_name: quake3e-windows-x86_64.zip
        - artifact_dir: windows-msvc-arm64
          artifact_name: quake3e-windows-arm64.zip
        - artifact_dir: macos-x86_64
          artifact_name: quake3e-macos-x86_64.zip
        - artifact_dir: macos-aarch64
          artifact_name: quake3e-macos-aarch64.zip
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
    - name: Create archive
      run: |
        7z a -r ${{ matrix.artifact_name }} ./${{ matrix.artifact_dir }}/*
    - name: Upload archive
      uses: svenstaro/upload-release-action@latest
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file: ${{ matrix.artifact_name }}
