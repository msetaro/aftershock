name: long width MSVC diagnostic
on:
  workflow_dispatch:
env:
  SOURCE_DATE_EPOCH: "1789257600"
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
jobs:
  windows-msvc:
    name: ${{ matrix.config }} Windows-MSVC ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x64
        - arm64
        config:
        - Release
        - Debug
        include:
        - arch: x64
          vcvars: amd64
          artifact: windows-msvc-x86_64
        - arch: arm64
          vcvars: amd64_arm64
          artifact: windows-msvc-arm64
    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.vcvars }}
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: cmake-msvc-${{ matrix.arch }}-${{ matrix.config }}
    - name: Build through ccache
      shell: pwsh
      run: |
        foreach ($renderer in @('opengl', 'vulkan')) {
          $name = if ($renderer -eq 'vulkan') { 'quake3e-vulkan' } else { 'quake3e' }
          cmake -S . -B "build/cmake-$renderer" -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.config }} "-DRENDERER_DEFAULT=$renderer" "-DCNAME=$name"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "build/cmake-$renderer"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install "build/cmake-$renderer" --config ${{ matrix.config }} --prefix "$env:GITHUB_WORKSPACE/bin"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
    - name: Generate and build Visual Studio projects
      run: |
        cmake --preset msvc-${{ matrix.arch }}
        cmake --build --preset msvc-${{ matrix.arch }} --config ${{ matrix.config }}
    - uses: actions/upload-artifact@v7
      if: matrix.config == 'Release'
      with:
        name: ${{ matrix.artifact }}
        path: bin
        if-no-files-found: error
        retention-days: 5
