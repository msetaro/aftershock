  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            toolchain: aarch64-linux
          - cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++
            packages: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            toolchain: mingw64
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Cross-build dedicated server
        run: |
          cmake -S . -B build/cross -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/${{ matrix.toolchain }}.cmake -DBUILD_CLIENT=OFF -DUSE_SDL=OFF -DUSE_CURL=OFF
          cmake --build build/cross -j4
      - name: Compile SDL Windows interfaces without curl headers
        if: startsWith(matrix.cc, 'x86_64-w64-mingw32-')
        run: |
          cmake -S . -B build/sdl -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw64.cmake -DBUILD_SERVER=OFF -DUSE_SDL=ON -DUSE_CURL=OFF
          cmake --build build/sdl -j4 --target CMakeFiles/client.dir/engine/platform/sdl/sdl_glimp.cpp.obj CMakeFiles/client.dir/engine/platform/sdl/sdl_gamma.cpp.obj

  # Existing build.yml also builds MSVC x64/ARM64 Debug/Release for this PR.

  match-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/match/go.sum
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-match-server
      - name: Install native client and public test-content prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-jsonschema ninja-build faketime xvfb xauth mesa-vulkan-drivers libsdl2-dev libasound2-dev mesa-common-dev openarena-data
      - name: Match contracts and acknowledged result delivery
        run: |
          cd tools/match
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
      - name: Owned image content and native match completion
        run: |
          python3 tests/match_content.py
          python3 tests/openarena.py
          cmake -S . -B ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_CURL=OFF
          cmake --build ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-ci --parallel 4
          python3 tests/match_exit.py --server ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-ci/release-linux-x86_64/quake3e.ded.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Build non-root distroless match image
        run: docker build -f tools/match/Dockerfile -t aftershock-match:issue28 .
      - name: Private kind allocation, native player, final ingest and replacement
        run: python3 tests/match_kind.py --image aftershock-match:issue28 --client ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-ci/release-linux-x86_64/quake3e.x64 --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Match lifecycle and measured resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: match-server
          path: |
            ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-kind/*.log
            ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-kind/report.json
            ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-kind/events.jsonl
            ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-kind/density.json
            ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-kind/density-samples.json
            ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-match-exit/*.log
