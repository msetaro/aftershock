name: regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - name: Install workflow parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Test invocation isolation
        run: |
          python3 tests/isolation.py
          python3 tests/check_isolation.py
          python3 tests/suite_contract.py
          python3 tests/affected_contract.py
          python3 tests/agent_recipes.py --check
      - name: Immutable build publication contract
        run: python3 tests/publish_build.py
      - name: Enforce reviewed clang-format version and style
        run: python3 tests/check_format.py --clang-format 'pipx run --spec clang-format==21.1.8 clang-format'

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - name: Install Clang analysis and build headers
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy libsdl2-dev libcurl4-openssl-dev mesa-common-dev
      - name: Enforce readability and report advisory checks
        run: python3 tests/check_tidy.py
      - name: Static analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy
          path: ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-tidy

  lifetimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}
      - name: Install Clang analysis and build headers
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tools libsdl2-dev libcurl4-openssl-dev mesa-common-dev
      - name: Reject unsupported build architectures
        run: |
          for arch in i686 armv7 ppc64le; do
            if cmake -S . -B "${{ env.AFTERSHOCK_SCRATCH }}/reject-$arch" -G Ninja -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$arch" > "${{ env.AFTERSHOCK_SCRATCH }}/reject-$arch.log" 2>&1; then
              echo "FAIL: unsupported architecture $arch configured"
              exit 1
            fi
            grep -F 'Aftershock supports 64-bit little-endian x86_64 and aarch64' "${{ env.AFTERSHOCK_SCRATCH }}/reject-$arch.log"
          done
      - name: Enforce integer type policy
        run: python3 tests/check_types.py
      - name: Enforce subsystem and OS boundaries
        run: python3 tests/check_boundaries.py
      - name: Enforce trivial engine lifetimes
        run: python3 tests/check_lifetimes.py

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++ -stdlib=libc++
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Install libc++
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libc++-dev libc++abi-dev
      - name: Cook owned source assets and verify production poses
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv python3-jsonschema ninja-build fonts-dejavu-core libsdl2-dev pkg-config
          python3 -m venv ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/pip install --disable-pip-version-check -r tools/cook/requirements.txt
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/cook.py --cxx '${{ matrix.cxx }}'
          CC='${{ matrix.cc }}' CXX='${{ matrix.cxx }}' ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/materials.py
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/iqm_scale.py --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/animation.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/physics.py --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/entities.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'

          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/ui_framework.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/weapons.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/effects.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/post.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/audio_events.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          python3 tests/audio_spatial.py --cxx '${{ matrix.cxx }}'
          python3 tests/audio_streams.py --cxx '${{ matrix.cxx }}'
          python3 tests/audio_voice.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          python3 tests/capture.py --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/temporal.py --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/streaming.py --cxx '${{ matrix.cxx }}'
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/effects_reference.py
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/lod.py --cxx '${{ matrix.cxx }}'
      - name: Declarative level language and design rules
        run: |
          python3 tests/level.py
          python3 tests/lighting.py
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/probes.py
      - name: Protocol, rewind, replication and identity contracts
        run: |
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/netcode_cleanup.py
          python3 tests/replication.py --cxx '${{ matrix.cxx }}'
          python3 tests/protocol.py --cxx '${{ matrix.cxx }}'
          python3 tests/rewind.py --cxx '${{ matrix.cxx }}'
          python3 tests/replication_policy.py --cxx '${{ matrix.cxx }}'
          python3 tests/identity.py --cxx '${{ matrix.cxx }}'
          python3 tests/native_pure.py --cxx '${{ matrix.cxx }}'
          python3 tests/devtools_data.py --cxx '${{ matrix.cxx }}'
      - name: Structured local developer command contract
        run: |
          python3 tests/agent_protocol.py --cxx '${{ matrix.cxx }}'
          python3 tests/agent_client.py
      - name: RHI contract and frame uploads
        run: python3 tests/rhi.py --cxx '${{ matrix.cxx }}'
      - name: Render graph dependencies and native reference trace
        run: |
          python3 tests/render_graph.py --cxx '${{ matrix.cxx }}'
          python3 tests/shadow_views.py --cxx '${{ matrix.cxx }}'
      - name: Verify pinned offline shader compilation
        if: matrix.cc == 'gcc'
        run: |
          curl --fail --location --retry 3 https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz -o ${{ env.AFTERSHOCK_SCRATCH }}/glslang.tar.gz
          echo '2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce  ${{ env.AFTERSHOCK_SCRATCH }}/glslang.tar.gz' | sha256sum --check
          mkdir -p ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-glslang
          tar -xzf ${{ env.AFTERSHOCK_SCRATCH }}/glslang.tar.gz -C ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-glslang
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/shaders.py --compiler ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-glslang/bin/glslang
      - name: Vulkan image acquisition status
        run: python3 tests/vulkan_acquire.py --cxx '${{ matrix.cxx }}'
      - name: Frame evidence negative controls
        run: python3 tests/check_frames.py
      - name: Native ABI and shared math compatibility
        run: |
          python3 tests/native_abi.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          python3 tests/native_shared.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Native ABI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-abi-${{ matrix.cc }}
          path: ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-native-abi
      - name: OpenArena string helpers
        run: python3 tests/openarena_strings.py --cc '${{ matrix.cc }}'
      - name: OpenArena native allocation alignment
        run: python3 tests/openarena_alloc.py --cc '${{ matrix.cc }}'
      - name: GPL team-leader name bounds
        if: matrix.cc == 'clang'
        run: python3 tests/teamleader.py
      - name: Native bot command byte conversion
        run: python3 tests/bot_command.py --cc '${{ matrix.cc }}'
      - name: Native info-string overlap
        run: python3 tests/native_info.py --cc '${{ matrix.cc }}'
      - name: Native flag initialization
        run: python3 tests/team_flags.py --cc '${{ matrix.cc }}'
      - name: Native team message formatting
        run: python3 tests/team_message.py --cxx '${{ matrix.cxx }}'
      - name: Native diagnostic formatting
        run: python3 tests/native_diagnostics.py --cxx '${{ matrix.cxx }}'
      - name: Native team voter bounds
        run: python3 tests/team_voters.py --cc '${{ matrix.cc }}'
      - name: Native UI weapon sentinel
        run: python3 tests/ui_weapon.py --cxx '${{ matrix.cxx }}'
      - name: Native UI skill range
        run: python3 tests/ui_skill.py --cxx '${{ matrix.cxx }}'
      - name: CPU affinity expressions
        run: python3 tests/affinity.py --cxx '${{ matrix.cxx }}'
      - name: Shared formatter capacity
        run: python3 tests/format.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Bot chat offset signedness
        run: python3 tests/chat_offset.py --cxx '${{ matrix.cxx }}'
      - name: Complete bot movement result
        run: python3 tests/bot_move.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Native game math word regression
        run: python3 tests/native_math.py --cc '${{ matrix.cc }}'
      - name: Differential goldens and one-ULP negative control
        run: python3 tests/run.py unit --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}' --negative-control

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}
      - name: Check known-bug classification
        run: python3 tests/check_known_bugs.py
      - name: ASan and UBSan with the existing suppression file
        run: python3 tests/run.py unit --cc clang --cxx clang++ --sanitize --known-bugs
      - name: ASan pointer comparisons
        run: python3 tests/run.py unit --cc clang --cxx clang++ --sanitize --pointer-compare --output ${{ env.AFTERSHOCK_SCRATCH }}/tests-pointers

  fuzz:
    continue-on-error: true # pending #35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [parse, msg, tga, png, jpeg]
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/fuzz/run.py '${{ matrix.target }}' --runs 10000

  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allocate isolated job scratch
        run: echo "AFTERSHOCK_SCRATCH=$(mktemp -d "$RUNNER_TEMP/aftershock.XXXXXX")" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}
      - name: Cache pinned offline content tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/aftershock-level-tools
            ~/.cache/aftershock-assets
            ~/.cache/aftershock-modernization/blender-5.0.1
          key: content-tools-${{ runner.os }}-${{ hashFiles('tools/level/toolchain.py', 'tools/blender/toolchain.py', 'tools/assets/themes/manhattan.json') }}
      - name: Install runtime tools and OpenArena content
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-pil python3-jsonschema ninja-build faketime xvfb x11-utils libxtst6 mesa-vulkan-drivers libsdl2-dev libcurl4-openssl-dev libasound2-dev mesa-common-dev openarena-data libarchive-dev fonts-dejavu-core
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Stage pinned upstream OpenArena gamecode
        run: python3 tests/openarena.py
      - name: Download URL construction
        run: python3 tests/download.py
      - name: Native ALSA thread checks
        run: python3 tests/audio.py
      - name: Collision and both-map bot goldens
        run: |
          python3 tests/run.py differential --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          python3 tests/run.py runtime --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Both-map Mesa timedemo frames
        run: python3 tests/demo.py --measure-gpu --pipeline-cache --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Window resize and hide/restore lifecycle
        run: python3 tests/window.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-demo-tests/build-vulkan/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Developer registry and allocator snapshots
        run: python3 tests/devtools_data.py
      - name: Native entity edit and save/reload
        run: python3 tests/dev_entities.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Native entity and world tools through shared controls
        run: python3 tests/dev_world_ui.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-world-ui --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Seeded local agent playthrough
        run: python3 tests/agent_play.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Agent scripted route, fire and capture report
        run: python3 tests/agent_cli.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Cooked character and visible source reload
        run: |
          python3 -m venv ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/pip install -r tools/cook/requirements.txt
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/agent_formats.py
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/cook_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-runtime-test --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: PBR material channels and ImGui instance edits
        run: |
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/materials_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-material-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/materials_runtime.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa --ui --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-material-ui
      - name: Presentation effects, source edits and mesh LOD lifecycle
        run: |
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/effects_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-effects-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/weapon_effects_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-weapon-effects-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/weapon_effects_runtime.py --decals --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-weapon-decals-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/effects_reference_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-effects-reference-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/soft_particles.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-soft-particles --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/decals_runtime.py --editor --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-decals-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/post_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-post-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/post_runtime.py --samples 4 --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-post-msaa --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/temporal_runtime.py --models --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/streaming_runtime.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/fidelity_runtime.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/decals_runtime.py --samples 4 --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-decals-msaa --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/effects_editor.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-effects-editor --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/lod_runtime.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-lod-runtime --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Owned animation gameplay and graph authoring
        run: |
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/animation_runtime.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/animation_editor.py --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-animation-editor --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/animation_runtime.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa --server-fps 100 --output ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-animation-runtime-100
          ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-cook-python/bin/python tests/animation_demo.py --binary ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data ${{ env.AFTERSHOCK_SCRATCH }}/aftershock-openarena-baseoa
      - name: Weapon lifecycle, range controls and fixed replay
        run: |
