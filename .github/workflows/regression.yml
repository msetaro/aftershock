name: regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Immutable build publication contract
        run: python3 tests/publish_build.py
      - name: Enforce reviewed clang-format version and style
        run: python3 tests/check_format.py --clang-format 'pipx run --spec clang-format==21.1.8 clang-format'

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang analysis and build headers
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy libsdl2-dev libcurl4-openssl-dev mesa-common-dev
      - name: Enforce readability and report advisory checks
        run: python3 tests/check_tidy.py
      - name: Static analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy
          path: /tmp/aftershock-tidy

  lifetimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Install Clang analysis and build headers
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tools libsdl2-dev libcurl4-openssl-dev mesa-common-dev
      - name: Reject unsupported build architectures
        run: |
          for arch in i686 armv7 ppc64le; do
            if cmake -S . -B "/tmp/reject-$arch" -G Ninja -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$arch" > "/tmp/reject-$arch.log" 2>&1; then
              echo "FAIL: unsupported architecture $arch configured"
              exit 1
            fi
            grep -F 'Aftershock supports 64-bit little-endian x86_64 and aarch64' "/tmp/reject-$arch.log"
          done
      - name: Enforce integer type policy
        run: python3 tests/check_types.py
      - name: Enforce subsystem and OS boundaries
        run: python3 tests/check_boundaries.py
      - name: Enforce trivial engine lifetimes
        run: python3 tests/check_lifetimes.py

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++ -stdlib=libc++
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Install libc++
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libc++-dev libc++abi-dev
      - name: Cook owned source assets and verify production poses
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv ninja-build
          python3 -m venv /tmp/aftershock-cook-python
          /tmp/aftershock-cook-python/bin/pip install --disable-pip-version-check -r tools/cook/requirements.txt
          /tmp/aftershock-cook-python/bin/python tests/cook.py --cxx '${{ matrix.cxx }}'
          CC='${{ matrix.cc }}' CXX='${{ matrix.cxx }}' /tmp/aftershock-cook-python/bin/python tests/materials.py
          /tmp/aftershock-cook-python/bin/python tests/iqm_scale.py --cxx '${{ matrix.cxx }}'
          /tmp/aftershock-cook-python/bin/python tests/animation.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          /tmp/aftershock-cook-python/bin/python tests/weapons.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Declarative level language and design rules
        run: |
          python3 tests/level.py
          python3 tests/lighting.py
          /tmp/aftershock-cook-python/bin/python tests/probes.py
      - name: Protocol, rewind, replication and identity contracts
        run: |
          /tmp/aftershock-cook-python/bin/python tests/netcode_cleanup.py
          python3 tests/replication.py --cxx '${{ matrix.cxx }}'
          python3 tests/protocol.py --cxx '${{ matrix.cxx }}'
          python3 tests/rewind.py --cxx '${{ matrix.cxx }}'
          python3 tests/replication_policy.py --cxx '${{ matrix.cxx }}'
          python3 tests/identity.py --cxx '${{ matrix.cxx }}'
          python3 tests/native_pure.py --cxx '${{ matrix.cxx }}'
          python3 tests/devtools_data.py --cxx '${{ matrix.cxx }}'
      - name: RHI contract and frame uploads
        run: python3 tests/rhi.py --cxx '${{ matrix.cxx }}'
      - name: Render graph dependencies and native reference trace
        run: |
          python3 tests/render_graph.py --cxx '${{ matrix.cxx }}'
          python3 tests/shadow_views.py --cxx '${{ matrix.cxx }}'
      - name: Verify pinned offline shader compilation
        if: matrix.cc == 'gcc'
        run: |
          curl --fail --location --retry 3 https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz -o /tmp/glslang.tar.gz
          echo '2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce  /tmp/glslang.tar.gz' | sha256sum --check
          mkdir -p /tmp/aftershock-glslang
          tar -xzf /tmp/glslang.tar.gz -C /tmp/aftershock-glslang
          /tmp/aftershock-cook-python/bin/python tests/shaders.py --compiler /tmp/aftershock-glslang/bin/glslang
      - name: Vulkan image acquisition status
        run: python3 tests/vulkan_acquire.py --cxx '${{ matrix.cxx }}'
      - name: Frame evidence negative controls
        run: python3 tests/check_frames.py
      - name: Native ABI and shared math compatibility
        run: |
          python3 tests/native_abi.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
          python3 tests/native_shared.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Native ABI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-abi-${{ matrix.cc }}
          path: /tmp/aftershock-native-abi
      - name: OpenArena string helpers
        run: python3 tests/openarena_strings.py --cc '${{ matrix.cc }}'
      - name: OpenArena native allocation alignment
        run: python3 tests/openarena_alloc.py --cc '${{ matrix.cc }}'
      - name: GPL team-leader name bounds
        if: matrix.cc == 'clang'
        run: python3 tests/teamleader.py
      - name: Native bot command byte conversion
        run: python3 tests/bot_command.py --cc '${{ matrix.cc }}'
      - name: Native info-string overlap
        run: python3 tests/native_info.py --cc '${{ matrix.cc }}'
      - name: Native flag initialization
        run: python3 tests/team_flags.py --cc '${{ matrix.cc }}'
      - name: Native team message formatting
        run: python3 tests/team_message.py --cxx '${{ matrix.cxx }}'
      - name: Native diagnostic formatting
        run: python3 tests/native_diagnostics.py --cxx '${{ matrix.cxx }}'
      - name: Native team voter bounds
        run: python3 tests/team_voters.py --cc '${{ matrix.cc }}'
      - name: Native UI weapon sentinel
        run: python3 tests/ui_weapon.py --cxx '${{ matrix.cxx }}'
      - name: Native UI skill range
        run: python3 tests/ui_skill.py --cxx '${{ matrix.cxx }}'
      - name: CPU affinity expressions
        run: python3 tests/affinity.py --cxx '${{ matrix.cxx }}'
      - name: Shared formatter capacity
        run: python3 tests/format.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Bot chat offset signedness
        run: python3 tests/chat_offset.py --cxx '${{ matrix.cxx }}'
      - name: Complete bot movement result
        run: python3 tests/bot_move.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Native game math word regression
        run: python3 tests/native_math.py --cc '${{ matrix.cc }}'
      - name: Differential goldens and one-ULP negative control
        run: python3 tests/run.py unit --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}' --negative-control

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Check known-bug classification
        run: python3 tests/check_known_bugs.py
      - name: ASan and UBSan with the existing suppression file
        run: python3 tests/run.py unit --cc clang --cxx clang++ --sanitize --known-bugs
      - name: ASan pointer comparisons
        run: python3 tests/run.py unit --cc clang --cxx clang++ --sanitize --pointer-compare --output /tmp/tests-pointers

  fuzz:
    continue-on-error: true # pending #35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [parse, msg, tga, png, jpeg]
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/fuzz/run.py '${{ matrix.target }}' --runs 10000

  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Install runtime tools and OpenArena content
        run: sudo apt-get update && sudo apt-get install -y python3-venv ninja-build faketime xvfb x11-utils libxtst6 mesa-vulkan-drivers libsdl2-dev libcurl4-openssl-dev libasound2-dev mesa-common-dev openarena-data libarchive-dev
      - name: Stage pinned upstream OpenArena gamecode
        run: python3 tests/openarena.py
      - name: Download URL construction
        run: python3 tests/download.py
      - name: Native ALSA thread checks
        run: python3 tests/audio.py
      - name: Collision and both-map bot goldens
        run: |
          python3 tests/run.py differential --content openarena --data /tmp/aftershock-openarena-baseoa
          python3 tests/run.py runtime --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Both-map Mesa timedemo frames
        run: python3 tests/demo.py --measure-gpu --pipeline-cache --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Window resize and hide/restore lifecycle
        run: python3 tests/window.py --binary /tmp/aftershock-demo-tests/build-vulkan/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Developer registry and allocator snapshots
        run: python3 tests/devtools_data.py
      - name: Native entity edit and save/reload
        run: python3 tests/dev_entities.py --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Native entity and world tools through real input
        run: python3 tests/dev_world_ui.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Cooked character and visible source reload
        run: |
          python3 -m venv /tmp/aftershock-cook-python
          /tmp/aftershock-cook-python/bin/pip install -r tools/cook/requirements.txt
          /tmp/aftershock-cook-python/bin/python tests/cook_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: PBR material channels and ImGui instance edits
        run: |
          /tmp/aftershock-cook-python/bin/python tests/materials_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/materials_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --ui --output /tmp/aftershock-material-ui
      - name: Owned animation gameplay and graph authoring
        run: |
          /tmp/aftershock-cook-python/bin/python tests/animation_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/animation_editor.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/animation_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --server-fps 100 --output /tmp/aftershock-animation-runtime-100
          /tmp/aftershock-cook-python/bin/python tests/animation_demo.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Weapon lifecycle, range controls and fixed replay
        run: |
          /tmp/aftershock-cook-python/bin/python tests/weapons_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --lifecycle
          /tmp/aftershock-cook-python/bin/python tests/weapon_range.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/weapons_demo.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Real protocol agreement and delayed hitscan with a snapshot budget
        run: |
          cmake -S . -B /tmp/aftershock-dev-entities/build -DBUILD_SERVER=ON
          cmake --build /tmp/aftershock-dev-entities/build --parallel 4
          cmake -S . -B /tmp/aftershock-protocol-v2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLIENT=OFF -DUSE_CURL=OFF -DAFTERSHOCK_EXTRA_FLAGS=-DAFTERSHOCK_NET_VERSION=3
          cmake --build /tmp/aftershock-protocol-v2 --parallel 4
          python3 tests/native_pure_runtime.py --client /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --server /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          python3 tests/protocol_runtime.py --client /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --server /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.ded.x64 --other-server /tmp/aftershock-protocol-v2/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/netcode_runtime.py --client /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --server /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --snapshot-budget 48
          /tmp/aftershock-cook-python/bin/python tests/netcode_runtime.py --client /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --server /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --weapons --client-fps 20 --snapshot-budget 256 --output /tmp/aftershock-weapons-network
      - name: Deterministic authored level and native bot paths
        run: |
          /tmp/aftershock-cook-python/bin/pip install -r tools/level/requirements.txt
          /tmp/aftershock-cook-python/bin/python tests/level.py --compile
          /tmp/aftershock-cook-python/bin/python tests/lighting.py --compile
          /tmp/aftershock-cook-python/bin/python tests/probes_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/ssao_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/lighting_runtime.py --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/lighting_runtime.py --shadows --lifecycle --output /tmp/aftershock-shadow-runtime --binary /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
          /tmp/aftershock-cook-python/bin/python tests/level_runtime.py --client /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --server /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Headless level reports and fixed-camera PNGs
        run: /tmp/aftershock-cook-python/bin/python tests/level_validate.py --client /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.x64 --server /tmp/aftershock-dev-entities/build/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Authored level evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: level-authoring
          path: |
            /tmp/aftershock-level-runtime
            /tmp/aftershock-level-validation
      - name: Development overlay input and renderer restart
        run: python3 tests/devtools.py --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Optional renderer module replay
        run: python3 tests/demo.py --modules --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/aftershock-demo-modules
      - name: Owned animation replay through renderer module
        run: /tmp/aftershock-cook-python/bin/python tests/animation_demo.py --modules --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/aftershock-animation-demo-modules
      - name: Shadow casters and renderer module restart
        run: |
          cmake -S . -B /tmp/aftershock-animation-demo-modules/build -DAFTERSHOCK_DEVTOOLS=ON
          cmake --build /tmp/aftershock-animation-demo-modules/build --parallel 4
          /tmp/aftershock-cook-python/bin/python tests/lighting_runtime.py --shadows --lifecycle --binary /tmp/aftershock-animation-demo-modules/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/aftershock-lighting-modules
      - name: Probe and SSAO renderer module restart
        run: |
          /tmp/aftershock-cook-python/bin/python tests/probes_runtime.py --binary /tmp/aftershock-animation-demo-modules/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/aftershock-probes-modules
          /tmp/aftershock-cook-python/bin/python tests/ssao_runtime.py --binary /tmp/aftershock-animation-demo-modules/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/aftershock-ssao-modules
      - name: Owned weapon replay through renderer module
        run: /tmp/aftershock-cook-python/bin/python tests/weapons_demo.py --binary /tmp/aftershock-animation-demo-modules/build/release-linux-x86_64/quake3e.x64 --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/aftershock-weapons-demo-modules
      - name: RHI replay measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rhi-replay-metrics
          path: /tmp/aftershock-demo-tests/*.log
      - name: GCC UBSan bot smoke
        run: python3 tests/run.py runtime --sanitize --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/tests-runtime-ubsan
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: runtime-diagnostics
          path: |
            /tmp/aftershock-tests/**/*.log
            /tmp/tests-runtime-ubsan/**/*.log
            /tmp/aftershock-demo-tests/**/*.log
            /tmp/aftershock-demo-tests/*.tga
            /tmp/aftershock-demo-modules/**/*.log
            /tmp/aftershock-demo-modules/*.tga
            /tmp/aftershock-window-tests/*
            /tmp/aftershock-protocol-runtime/*.log
            /tmp/aftershock-netcode-runtime/*.log
            /tmp/aftershock-dev-entities/**/*.log
            /tmp/aftershock-dev-world-ui/*.log
            /tmp/aftershock-dev-world-ui/*.tga
            /tmp/aftershock-cook-runtime-test/*.log
            /tmp/aftershock-cook-runtime-test/*.tga
            /tmp/aftershock-cook-runtime-test/latency.txt
            /tmp/aftershock-material-runtime/*.log
            /tmp/aftershock-material-runtime/*.tga
            /tmp/aftershock-material-runtime/*.json
            /tmp/aftershock-material-ui/*.log
            /tmp/aftershock-material-ui/*.tga
            /tmp/aftershock-material-ui/*.json
            /tmp/aftershock-ssao-runtime/*
            /tmp/aftershock-ssao-modules/*
            /tmp/aftershock-reflection-runtime/*
            /tmp/aftershock-probes-modules/*
            /tmp/aftershock-shadow-runtime/*
            /tmp/aftershock-lighting-modules/*
            /tmp/aftershock-lighting-runtime/*.log
            /tmp/aftershock-lighting-runtime/*.tga
            /tmp/aftershock-weapons-runtime/*
            /tmp/aftershock-weapon-range/*
            /tmp/aftershock-weapons-demo/*
            /tmp/aftershock-weapons-network/*
            /tmp/aftershock-weapons-demo-modules/*
            /tmp/aftershock-animation-runtime/*.log
            /tmp/aftershock-animation-runtime/*.tga
            /tmp/aftershock-animation-editor/*.log
            /tmp/aftershock-animation-editor/*.tga
            /tmp/aftershock-animation-runtime-100/*.log
            /tmp/aftershock-animation-demo/*.log
            /tmp/aftershock-animation-demo/*.tga
            /tmp/aftershock-animation-demo/*.json
            /tmp/aftershock-animation-demo-modules/*.log
            /tmp/aftershock-animation-demo-modules/*.tga
            /tmp/aftershock-animation-demo-modules/*.json
            /tmp/aftershock-devtools-tests/**/*.log
            /tmp/aftershock-devtools-tests/runtime/*.tga
            /tmp/tests-native-runtime/**/*.log
            /tmp/tests-native-demo/**/*.log
            /tmp/tests-native-demo/*.tga

  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            toolchain: aarch64-linux
          - cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++
            packages: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            toolchain: mingw64
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ github.job }}-${{ matrix.cc }}
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Cross-build dedicated server
        run: |
          cmake -S . -B build/cross -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/${{ matrix.toolchain }}.cmake -DBUILD_CLIENT=OFF -DUSE_SDL=OFF -DUSE_CURL=OFF
          cmake --build build/cross -j4
      - name: Compile SDL Windows interfaces without curl headers
        if: startsWith(matrix.cc, 'x86_64-w64-mingw32-')
        run: |
          cmake -S . -B build/sdl -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw64.cmake -DBUILD_SERVER=OFF -DUSE_SDL=ON -DUSE_CURL=OFF
          cmake --build build/sdl -j4 --target CMakeFiles/client.dir/engine/platform/sdl/sdl_glimp.cpp.obj CMakeFiles/client.dir/engine/platform/sdl/sdl_gamma.cpp.obj

  # Existing build.yml also builds MSVC x64/ARM64 Debug/Release for this PR.

  match-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/match/go.sum
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-match-server
      - name: Install native client and public test-content prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build faketime xvfb xauth mesa-vulkan-drivers libsdl2-dev libasound2-dev mesa-common-dev openarena-data
      - name: Match contracts and acknowledged result delivery
        run: |
          cd tools/match
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
      - name: Owned image content and native match completion
        run: |
          python3 tests/match_content.py
          python3 tests/openarena.py
          cmake -S . -B /tmp/aftershock-match-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_CURL=OFF
          cmake --build /tmp/aftershock-match-ci --parallel 4
          python3 tests/match_exit.py --server /tmp/aftershock-match-ci/release-linux-x86_64/quake3e.ded.x64 --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Build non-root distroless match image
        run: docker build -f tools/match/Dockerfile -t aftershock-match:issue28 .
      - name: Private kind allocation, native player, final ingest and replacement
        run: python3 tests/match_kind.py --image aftershock-match:issue28 --client /tmp/aftershock-match-ci/release-linux-x86_64/quake3e.x64 --data /tmp/aftershock-openarena-baseoa
      - name: Match lifecycle and measured resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: match-server
          path: |
            /tmp/aftershock-match-kind/*.log
            /tmp/aftershock-match-kind/report.json
            /tmp/aftershock-match-kind/events.jsonl
            /tmp/aftershock-match-kind/density.json
            /tmp/aftershock-match-kind/density-samples.json
            /tmp/aftershock-match-exit/*.log
