name: regression
on:
  pull_request:
    branches: [modernization]
  push:
    branches: [modernization]
  workflow_dispatch:

jobs:
  lifetimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang analysis and build headers
        run: sudo apt-get update && sudo apt-get install -y clang-tools libsdl2-dev libcurl4-openssl-dev mesa-common-dev
      - name: Enforce trivial engine lifetimes
        run: python3 tests/check_lifetimes.py

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++ -stdlib=libc++
    steps:
      - uses: actions/checkout@v7
      - name: Install libc++
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Frame evidence negative controls
        run: python3 tests/check_frames.py
      - name: Build C native modules and compare ABI layouts
        run: python3 tests/native.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Build C++ native modules and compare shared functions
        run: |
          python3 tests/native.py --language c++ --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}' --output /tmp/native-cpp
          python3 tests/native_shared.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Install native layout tool
        if: matrix.cc == 'gcc'
        run: sudo apt-get update && sudo apt-get install -y pahole
      - name: Native C/C++ layout and symbol gates
        if: matrix.cc == 'gcc'
        run: python3 -B tests/native_gates.py
      - name: Native comparison evidence
        if: always() && matrix.cc == 'gcc'
        uses: actions/upload-artifact@v7
        with:
          name: native-comparisons
          path: |
            /tmp/aftershock-native-gates/*.json
            /tmp/aftershock-native-gates/**/*.diff
            /tmp/aftershock-native-gates/**/*.command
            /tmp/aftershock-native-gates/**/*.log
      - name: OpenArena string helpers
        run: python3 tests/openarena_strings.py --cc '${{ matrix.cc }}'
      - name: OpenArena native allocation alignment
        run: python3 tests/openarena_alloc.py --cc '${{ matrix.cc }}'
      - name: GPL team-leader name bounds
        if: matrix.cc == 'clang'
        run: python3 tests/teamleader.py
      - name: Native bot command byte conversion
        run: python3 tests/bot_command.py --cc '${{ matrix.cc }}'
      - name: Native info-string overlap
        run: python3 tests/native_info.py --cc '${{ matrix.cc }}'
      - name: Native flag initialization
        run: python3 tests/team_flags.py --cc '${{ matrix.cc }}'
      - name: Native team voter bounds
        run: python3 tests/team_voters.py --cc '${{ matrix.cc }}'
      - name: Native UI weapon sentinel
        run: python3 tests/ui_weapon.py --cxx '${{ matrix.cxx }}'
      - name: Complete bot movement result
        run: python3 tests/bot_move.py --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}'
      - name: Native game math word regression
        run: python3 tests/native_math.py --cc '${{ matrix.cc }}'
      - name: Differential goldens and one-ULP negative control
        run: python3 tests/run.py unit --cc '${{ matrix.cc }}' --cxx '${{ matrix.cxx }}' --negative-control

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check known-bug classification
        run: python3 tests/check_known_bugs.py
      - name: ASan and UBSan with the existing suppression file
        run: python3 tests/run.py unit --cc clang --cxx clang++ --sanitize --known-bugs
      - name: ASan pointer comparisons
        run: python3 tests/run.py unit --cc clang --cxx clang++ --sanitize --pointer-compare --output /tmp/tests-pointers

  fuzz:
    continue-on-error: true # pending #35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [parse, msg, tga, png, jpeg]
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/fuzz/run.py '${{ matrix.target }}' --runs 10000

  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime tools and OpenArena content
        run: sudo apt-get update && sudo apt-get install -y faketime xvfb mesa-vulkan-drivers libsdl2-dev libcurl4-openssl-dev libasound2-dev mesa-common-dev openarena-data
      - name: Stage pinned upstream OpenArena gamecode
        run: python3 tests/openarena.py
      - name: Download URL construction
        run: python3 tests/download.py
      - name: Native ALSA thread checks
        run: python3 tests/audio.py
      - name: Collision and both-map bot goldens
        run: |
          python3 tests/run.py differential --content openarena --data /tmp/aftershock-openarena-baseoa
          python3 tests/run.py runtime --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: Both-map Mesa timedemo frames
        run: python3 tests/demo.py --content openarena --data /tmp/aftershock-openarena-baseoa
      - name: GCC UBSan bot smoke
        run: python3 tests/run.py runtime --sanitize --content openarena --data /tmp/aftershock-openarena-baseoa --output /tmp/tests-runtime-ubsan
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: runtime-diagnostics
          path: |
            /tmp/aftershock-tests/**/*.log
            /tmp/tests-runtime-ubsan/**/*.log
            /tmp/aftershock-demo-tests/**/*.log
            /tmp/aftershock-demo-tests/*.tga
            /tmp/tests-native-runtime/**/*.log
            /tmp/tests-native-demo/**/*.log
            /tmp/tests-native-demo/*.tga

  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            settings: ARCH=aarch64
          - cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++
            packages: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            settings: PLATFORM=mingw64 ARCH=x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Cross-build dedicated server
        run: make -j4 BUILD_CLIENT=0 CC='${{ matrix.cc }}' CXX='${{ matrix.cxx }}' ${{ matrix.settings }}

  # Existing build.yml also builds MSVC x64/ARM64 Debug/Release for this PR.
